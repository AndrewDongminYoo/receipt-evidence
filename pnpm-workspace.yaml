packages:
  - packages/*
  - apps/*

# Keep one project graph document visible to GitHub's dependency reader.
# Corepack and CI still select package.json's pinned pnpm version.
pmOnFail: ignore

# Security overrides target exact SDK 57 parents or individual affected lines.
# Bare package names would cross unrelated consumers' compatibility boundaries.
overrides:
  # The other SDK 57 parents now request patched matchers themselves.
  # Fingerprint still needs overrides; its consumer regression covers ignore
  # matching and directory pruning across these major-version boundaries.
  "@expo/fingerprint@0.20.15>glob": 14.0.4 # GHSA-3g3m-2fjr-6pw4
  "@expo/fingerprint@0.20.15>minimatch": 11.0.5 # GHSA-g3hv-75wg-m249
  "@xmldom/xmldom@0.8": ^0.8.15 # GHSA-6gmq-8vp8-gcm6
  "@xmldom/xmldom@0.9": ^0.9.12 # GHSA-6gmq-8vp8-gcm6
  # uuid: no patch exists inside the 7.x line (fixed only from 11.1.1). Forced up
  # because the exported API (v1/v3/v4/v5 functions) is unchanged from 7 onward
  # and uuid 11 still ships a CJS entry point for xcode's require().
  "uuid@7": ^11.1.1 # GHSA-w5hq-g745-h8pq
  # image-size 2.x is API-incompatible with Metro 0.84.4; Expo's patched
  # Metro wrapper resolves the full 0.84.5 family, which no longer uses it.
  "@expo/metro@56.0.0": 56.0.2 # GHSA-5p2g-fcmc-qvqq
